[package]
name = "comfy-i18n-parser"
version = "0.1.0"
edition = "2024"
description = "Parser the source formats into the comfy-i18n-ast"
readme = "../README.md"
repository = "https://github.com/tdymel/comfy-i18n"
documentation = "https://docs.rs/comfy-i18n"
license = "MIT OR Apache-2.0"

[dependencies]
comfy-i18n-ast = { path = "./../ast", version = "0.1" }
proc-macro2 = "1"
quote = "1"
syn = "2"
thiserror = "2"
dfmt = "0.4.1"

[dev-dependencies]
paste = "1"
criterion = "0.8"

[[bench]]
name = "comfy"
harness = false
