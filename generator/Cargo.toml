[package]
name = "comfy-i18n-generator"
version = "0.1.0"
edition = "2024"
description = "Target language specific code generation helper"
readme = "../README.md"
repository = "https://github.com/tdymel/comfy-i18n"
documentation = "https://docs.rs/comfy-i18n"
license = "MIT OR Apache-2.0"

[dependencies]
comfy-i18n-ast = { path = "./../ast", version = "0.1" }
proc-macro2 = "1"
quote = "1"
dfmt = "0.4.1"

[dependencies.xxhash-rust]
version = "0.8.12"
features = ["xxh3"]
